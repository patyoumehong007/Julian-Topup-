<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julian Topup — Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FF; --surface:#FFFFFF; --tile:#EBEEFF; --ink:#12153A; --muted:#565C8C; --line:#D5DAF3;
  --accent:#3355F5; --accent-ink:#FFFFFF; --ok:#15803D; --danger:#C2255C; --shadow:rgba(30,40,120,.14);
  --pend-bg:#FEF3C7; --pend-fg:#92400E; --paid-bg:#DBEAFE; --paid-fg:#1E40AF;
  --deliv-bg:#DCFCE7; --deliv-fg:#166534; --canc-bg:#E5E7EB; --canc-fg:#4B5563;
  --font-display:'Koulen','Noto Sans Khmer',system-ui,sans-serif;
  --font-body:'Kantumruy Pro','Noto Sans Khmer',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D26; --surface:#141838; --tile:#1C2150; --ink:#EDEFFF; --muted:#A3A9DA; --line:#2B3172;
    --accent:#7C93FF; --accent-ink:#0B0D26; --ok:#4ADE80; --danger:#FF7BA9; --shadow:rgba(0,0,0,.5);
    --pend-bg:#4A3308; --pend-fg:#FCD34D; --paid-bg:#1B2A66; --paid-fg:#9DB4FF;
    --deliv-bg:#0F3A22; --deliv-fg:#86EFAC; --canc-bg:#2A2F45; --canc-fg:#B8BED6;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D26; --surface:#141838; --tile:#1C2150; --ink:#EDEFFF; --muted:#A3A9DA; --line:#2B3172;
  --accent:#7C93FF; --accent-ink:#0B0D26; --ok:#4ADE80; --danger:#FF7BA9; --shadow:rgba(0,0,0,.5);
  --pend-bg:#4A3308; --pend-fg:#FCD34D; --paid-bg:#1B2A66; --paid-fg:#9DB4FF;
  --deliv-bg:#0F3A22; --deliv-fg:#86EFAC; --canc-bg:#2A2F45; --canc-fg:#B8BED6;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.75;overflow-x:hidden}
h1,h2,h3,h4,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;cursor:pointer;font-weight:700;white-space:nowrap;background:var(--accent);color:var(--accent-ink);--cut:9px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{clip-path:none;border-radius:8px}
.btn.ghost{background:var(--tile);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:36px;padding:0 14px;font-size:.9rem;--cut:7px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn.plain{border:0;background:transparent}
.icon-btn .moon{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .moon{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .icon-btn .sun{display:none}
  :root:not([data-theme="light"]) .icon-btn .moon{display:block}
}
body.ro [data-write]{display:none !important}

/* ---------- layout ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 clamp(14px,3vw,28px);max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;line-height:1}
.brand svg{width:28px;height:26px;color:var(--accent)}
.brand em{font-style:normal;font-weight:400;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;background:var(--tile);font-size:.8rem;font-weight:700;line-height:1.8;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.local i{background:#D97706}
.chip.ro i{background:var(--danger)}
.shell{max-width:1240px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
main{padding:18px 0 calc(96px + env(safe-area-inset-bottom,0px));outline:none;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{display:grid;justify-items:center;gap:0;padding:8px 4px 8px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.66rem;line-height:1.5;cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);bottom:auto;left:auto;right:auto;display:grid;grid-template-columns:1fr;gap:4px;margin-top:18px;padding:0;background:transparent;border:0}
  .nav button{grid-auto-flow:column;justify-content:start;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:1rem}
  .nav button[aria-current="page"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
  main{padding-bottom:60px}
}

.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.page-head h1{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.6}
.page-head .actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;padding:10px 14px;border-radius:12px;background:var(--pend-bg);color:var(--pend-fg);font-size:.9rem;line-height:1.7}
.banner.ro{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card + .card{margin-top:14px}
.card h2{font-size:1.1rem;font-weight:700;line-height:1.6}
.card .sub{margin-top:2px;color:var(--muted);font-size:.9rem;line-height:1.7}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* chips row */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip small{font-size:.78rem;opacity:.8}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.kpi .k-l{color:var(--muted);font-size:.85rem;line-height:1.5}
.kpi .k-v{margin-top:4px;font-size:1.6rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .k-s{color:var(--muted);font-size:.8rem;line-height:1.5}
.kpi.attn{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.grid2{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){.grid2{grid-template-columns:1.4fr 1fr}}
.grid2 > .card + .card{margin-top:0}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar.zero{fill:var(--line)}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--font-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.toplist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem;line-height:1.5}
.toplist li:first-child{border-top:0}
.toplist .meter{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--tile);overflow:hidden}
.toplist .meter i{display:block;height:100%;background:var(--accent)}
.todo{display:grid;gap:8px}
.todo-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--tile)}
.todo-row b{display:block;font-size:.95rem;line-height:1.5}
.todo-row span{color:var(--muted);font-size:.82rem;line-height:1.5}

/* orders */
.search{width:100%;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.olist{display:grid;gap:10px;margin-top:12px}
@media (min-width:1100px){.olist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ocard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.ocard-main{display:grid;gap:0;text-align:left;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.oc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc-code{font-size:1rem;letter-spacing:.02em}
.oc-game{font-weight:600;line-height:1.5}
.oc-line{color:var(--muted);font-size:.86rem;line-height:1.55;word-break:break-word}
.oc-time{color:var(--muted);font-size:.78rem;line-height:1.5}
.badge{display:inline-block;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:700;line-height:1.7}
.st-pending{background:var(--pend-bg);color:var(--pend-fg)}
.st-paid{background:var(--paid-bg);color:var(--paid-fg)}
.st-delivered{background:var(--deliv-bg);color:var(--deliv-fg)}
.st-cancelled{background:var(--canc-bg);color:var(--canc-fg)}
.more{display:block;margin:14px auto 0}

/* products */
.glist{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.grow.off{opacity:.6}
.gtile{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--tint);color:#fff;font-family:var(--font-display);font-size:1.25rem;line-height:1}
.ginfo{display:grid;text-align:left;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.ginfo b{line-height:1.5}
.ginfo span{color:var(--muted);font-size:.85rem;line-height:1.5}
.gctl{display:flex;align-items:center;gap:4px}
.gctl .icon-btn{width:36px;height:36px;border-radius:10px}
.gctl .icon-btn svg{width:16px;height:16px}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px;border-radius:999px}

/* forms */
.fld{display:grid;gap:5px}
.fld label,.fld .lbl{font-weight:600;font-size:.92rem;line-height:1.5}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--tile)}
.fld textarea{padding:10px 12px;min-height:88px;line-height:1.6;resize:vertical}
.fld input[type="color"]{padding:4px;min-height:46px}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline-offset:1px;border-color:var(--accent)}
.fld .hint{color:var(--muted);font-size:.82rem;line-height:1.6}
.fld .err{color:var(--danger);font-size:.85rem;font-weight:600}
.fgrid{display:grid;gap:12px}
.fld{min-width:0}
.fld input[type="datetime-local"]{min-width:0;max-width:100%}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld[hidden]{display:none}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.frow > span{line-height:1.5}
.divider{border:0;border-top:1px dashed var(--line);margin:14px 0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:8px}
.prow input[type="number"]{min-height:42px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--tile);width:100%}
.star{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--tile);cursor:pointer;position:relative;font-size:1.1rem;line-height:1}
.star input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.star:has(input:checked){background:#FFC94A;color:#3A2800}
.star:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.phead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;margin-bottom:6px;color:var(--muted);font-size:.8rem;line-height:1.4}
.pays li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pays li:first-child{border-top:0}
.pmono{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--tint);color:#fff;font-weight:700;font-size:.8rem;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;line-height:1.6}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;word-break:break-word}
.logrow{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);line-height:1.6}
pre.code{margin:0;padding:12px;border-radius:10px;background:var(--tile);font-size:.75rem;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.qrwrap{display:grid;justify-items:center;gap:8px}
.qrwrap img{width:min(260px,100%);height:auto;border-radius:12px;background:#fff}

/* images + extra panels */
.prow,.phead{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px auto auto}
.pimg{position:relative;width:40px;height:40px}
.pimg-l{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--tile);cursor:pointer;overflow:hidden;border:1.5px dashed var(--line)}
.pimg-l:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.pimg-prev{display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font-weight:700}
.pimg-prev img{width:100%;height:100%;object-fit:contain}
.pimg-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border:0;border-radius:50%;background:var(--danger);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:none;padding:0}
.pimg.has .pimg-x{display:block}
.imgrow{display:flex;align-items:center;gap:12px}
.imgprev{display:grid;place-items:center;width:84px;height:84px;border-radius:12px;background:var(--tile);border:1.5px dashed var(--line);overflow:hidden;flex:none;font-size:.8rem;color:var(--muted)}
.imgprev.wide{width:150px;height:90px}
.imgprev img{width:100%;height:100%;object-fit:contain}
.imgctl{display:flex;flex-wrap:wrap;gap:8px}
.imgctl label.btn{position:relative}
.fld input[type="text"][data-imgurl]{min-height:40px;font-size:.88rem}
.gtile{overflow:hidden}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.th{position:relative;width:76px;height:60px;border-radius:10px;overflow:hidden;background:var(--tile)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;padding:0}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.bprev{width:108px;height:64px;border-radius:10px;object-fit:cover;background:var(--tile)}
.pmono{overflow:hidden}
.pmono img{width:100%;height:100%;object-fit:contain;background:#fff}
.tgrid{display:grid;gap:12px}
@media (min-width:700px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sect{font-weight:700;font-size:.95rem;margin:16px 0 8px;color:var(--accent)}

/* sheets */
dialog{color:var(--ink);background:var(--surface);border:0;padding:0}
dialog::backdrop{background:rgba(8,10,30,.6)}
#sheet{width:100%;max-width:560px;max-height:94dvh;margin:auto auto 0;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
#sheet[open]{display:flex;flex-direction:column;animation:sheet-up .26s ease-out}
@media (min-width:640px){#sheet{margin:auto;border-radius:24px;max-height:90dvh}}
@keyframes sheet-up{from{transform:translateY(50px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sheet[open]{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 10px 20px;border-bottom:1px solid var(--line)}
.sh-head h2{font-family:var(--font-display);font-weight:400;font-size:1.35rem;line-height:1.6;outline:none}
.sh-body{padding:16px 20px;overflow:auto;flex:1;overscroll-behavior:contain}
.sh-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sh-foot .btn{flex:1 1 auto}
.sh-foot .spacer{flex:1 0 100%;height:0}
#confirmDlg{width:min(420px,calc(100% - 32px));border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#confirmDlg .cf{padding:22px;display:grid;gap:14px}
#confirmDlg .cf h2{font-size:1.15rem;line-height:1.6}
#confirmDlg .cf div{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger);color:#fff}
@media (min-width:900px){#toast{bottom:28px}}
#boot{position:fixed;inset:0;z-index:200;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--bg);color:var(--muted)}
#boot svg{width:44px;height:40px;color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
@media (prefers-reduced-motion:reduce){#boot svg{animation:none}}
</style>
</head>
<body>

  function persistOrders(){ try{ localStorage.setItem(LS_ORD, JSON.stringify(S.orders)); }catch(e){ toast('មិនអាចរក្សាទុកក្នុង browser បានទេ', true); } }
  return {
    init: function(done){
      try{ var c = localStorage.getItem(LS_CFG); if(c) S.cfg = normalizeConfig(JSON.parse(c)); }catch(e){}
      try{ var o = localStorage.getItem(LS_ORD); if(o) S.orders = JSON.parse(o) || []; }catch(e){}
      sortOrders(); done();
    },
    saveConfig: function(cfg){
      S.cfg = normalizeConfig(clone(cfg));
      try{ localStorage.setItem(LS_CFG, JSON.stringify(S.cfg)); }catch(e){ toast('មិនអាចរក្សាទុកក្នុង browser បានទេ', true); }
      return Promise.resolve();
    },
    saveOrder: function(o){
      var i = S.orders.findIndex(function(x){ return x.id === o.id; });
      if(i >= 0) S.orders[i] = clone(o); else S.orders.push(clone(o));
      sortOrders(); persistOrders(); return Promise.resolve();
    },
    deleteOrder: function(id){
      S.orders = S.orders.filter(function(x){ return x.id !== id; });
      persistOrders(); return Promise.resolve();
    }
  };
}

function makeSharedStore(db){
  var chains = {};
  function queue(key, fn){
    var p = (chains[key] || Promise.resolve()).then(fn, fn);
    chains[key] = p.catch(function(){});
    return p;
  }
  var seeded = false;
  return {
    init: function(done){
      var first = {cfg:false, ord:false}, finished = false;
      function check(){ if(!finished && first.cfg && first.ord){ finished = true; done(); } }
      db.doc('config/main').onSnapshot(function(snap){
        if(snap.exists){ S.cfg = normalizeConfig(clone(snap.data())); }
        else if(S.canWrite && !seeded){ seeded = true; queue('config/main', function(){ return db.doc('config/main').set(clone(defaultConfig())); }); }
        first.cfg = true; check(); if(finished) renderAll(true);
      }, function(e){ first.cfg = true; check(); });
      db.collection('orders').orderBy('createdAt', 'desc').limit(1000).onSnapshot(function(snap){
        S.orders = snap.docs.map(function(d){ return clone(d.data()); });
        first.ord = true; check(); if(finished) renderAll(true);
      }, function(e){ first.ord = true; check(); });
    },
    saveConfig: function(cfg){ return queue('config/main', function(){ return db.doc('config/main').set(clone(cfg)); }); },
    saveOrder: function(o){ return queue('orders/' + o.id, function(){ return db.doc('orders/' + o.id).set(clone(o)); }); },
    deleteOrder: function(id){ return queue('orders/' + id, function(){ return db.doc('orders/' + id).delete(); }); }
  };
}

function guard(){
  if(S.canWrite) return true;
  toast('អ្នកមានសិទ្ធិមើលតែប៉ុណ្ណោះ', true); return false;
}
function failMsg(e){
  if(e && e.msg) return e.msg; var code = e && e.code;
  if(code === 'quota_exceeded') return 'ទិន្នន័យពេញកំណត់ សូមលុបបញ្ជាទិញចាស់ៗ';
  if(code === 'invalid_argument') return 'មិនមានសិទ្ធិកែប្រែទិន្នន័យទេ';
  return 'រក្សាទុកមិនបានទេ សូមព្យាយាមម្តងទៀត';
}
/* Every mutation goes through these two */
function commitConfig(mutator, okMsg){
  if(!guard()) return Promise.resolve(false);
  var next = clone(S.cfg); mutator(next);
  return Promise.resolve(store.saveConfig(next)).then(function(){
    if(S.mode !== 'shared') renderAll(true);
    if(okMsg) toast(okMsg); return true;
  }, function(e){ toast(failMsg(e), true); return false; });
}
function commitOrder(o, okMsg){
  if(!guard()) return Promise.resolve(false);
  o.updatedAt = Date.now();
  return Promise.resolve(store.saveOrder(o)).then(function(){
    if(S.mode !== 'shared') renderAll(true);
    if(okMsg) toast(okMsg); return true;
  }, function(e){ toast(failMsg(e), true); return false; });
}
function removeOrder(id, okMsg){
  if(!guard()) return Promise.resolve(false);
  return Promise.resolve(store.deleteOrder(id)).then(function(){
    if(S.mode !== 'shared') renderAll(true);
    if(okMsg) toast(okMsg); return true;
  }, function(e){ toast(failMsg(e), true); return false; });
}

/* Read the receipt text the storefront gives customers (or the older order message) */
function parseReceipt(text){
  var out = {}, lines = String(text).split(/\r?\n/);
  lines.forEach(function(l){
    var m = l.match(/^\s*([^:：]+)[:：]\s*(.+?)\s*$/); if(!m) return;
    var k = m[1].trim(), v = m[2].trim();
    if(/លេខបញ្ជាទិញ|order/i.test(k)) out.code = v;
    else if(/ហ្គេម|game/i.test(k)) out.game = v;
    else if(/^(player id|username|user id)/i.test(k)){ out.pid = v; out.idLabel = k; }
    else if(/កញ្ចប់|package|item/i.test(k)) out.pack = v;
    else if(/វិធីបង់|payment|method/i.test(k)) out.method = v;
    else if(/សរុប|total/i.test(k)) out.total = v;
    else if(/ស្ថានភាព|status/i.test(k)) out.statusText = v;
    else if(/ពេលវេលា|time|date/i.test(k)) out.when = v;
  });
  if(!out.code){ var cm = String(text).match(/JL-[A-Z0-9]{4,10}/); if(cm) out.code = cm[0]; }
  if(out.pid){
    var pm = out.pid.match(/^(\S+?)\s*\(\s*Server\s*(\d+)\s*\)/i);
    if(pm){ out.pid = pm[1]; out.sid = pm[2]; }
  }
  if(out.pack){
    var km = out.pack.match(/^([\d,.]+)\s*(.*)$/);
    if(km){ out.amount = Number(km[1].replace(/,/g, '')); out.unit = km[2]; }
  }
  if(out.total){
    var tm = out.total.match(/\$\s*([\d,.]+)/) || out.total.match(/([\d,.]+)\s*USD/i);
    if(tm) out.usd = Number(tm[1].replace(/,/g, ''));
  }
  if(out.statusText){
    if(/ផ្ទៀងផ្ទាត់/.test(out.statusText) && !/រង់ចាំ/.test(out.statusText)) out.status = 'paid';
    else out.status = 'pending';
  }
  if(out.when){
    var wm = out.when.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
    if(wm) out.createdAt = new Date(+wm[3], +wm[2] - 1, +wm[1], +wm[4], +wm[5]).getTime();
  }
  if(out.game){
    var up = out.game.toUpperCase().replace(/\s+/g, ' ');
    var found = null;
    S.cfg.games.forEach(function(g){
      var full = (g.name + ' ' + g.region).toUpperCase();
      if(!found && (full === up || up.indexOf(full) >= 0)) found = g;
    });
    if(found) out.gameId = found.id;
  }
  return out;
}

var dlCap = null;
try{ if(window.claude && window.claude.use) window.claude.use('downloads').then(function(d){ dlCap = d; }, function(){}); }catch(e){}
function saveFile(name, text){
  if(dlCap){
    return dlCap.save({filename:name, data:text}).then(function(){ toast('បានរក្សាទុកឯកសារ'); }, function(e){
      if(!(e && e.code === 'declined')) fallbackSave(name, text);
    });
  }
  fallbackSave(name, text); return Promise.resolve();
}
function fallbackSave(name, text){
  try{
    var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('កំពុងទាញយកឯកសារ');
  }catch(e){ toast('ទាញយកមិនបានទេ សូមចម្លងជំនួស', true); }
}
function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); toast(ok ? okMsg : 'ចម្លងមិនបានទេ', !ok);
  }
  try{ navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback); }catch(e){ fallback(); }
}

/* ---------- Dashboard ---------- */
function rangeStart(r){ var t = startOfDay(Date.now()); return r === 'today' ? t : (r === '7' ? t - 6 * 864e5 : t - 29 * 864e5); }
function viewDash(){
  var start = rangeStart(S.range);
  var inR = S.orders.filter(function(o){ return o.createdAt >= start; });
  var rev = inR.filter(isRevenue).reduce(function(s, o){ return s + Number(o.usd || 0); }, 0);
  var cnt = inR.filter(function(o){ return o.status !== 'cancelled'; }).length;
  var pending = S.orders.filter(function(o){ return o.status === 'pending'; });
  var toDeliver = S.orders.filter(function(o){ return o.status === 'paid'; });

  var n = S.range === 'today' ? 24 : (S.range === '7' ? 7 : 30), vals = [], labels = [], i;
  for(i = 0; i < n; i++){ vals.push(0); }
  inR.filter(isRevenue).forEach(function(o){
    var idx = S.range === 'today' ? new Date(o.createdAt).getHours() : Math.floor((startOfDay(o.createdAt) - start) / 864e5);
    if(idx >= 0 && idx < n) vals[idx] += Number(o.usd || 0);
  });
  for(i = 0; i < n; i++){
    if(S.range === 'today') labels.push(String(i));
    else { var d = new Date(start + i * 864e5); labels.push(d.getDate() + '/' + (d.getMonth() + 1)); }
  }
  var W = 340, H = 150, pl = 6, pb = 22, pt = 12, max = Math.max.apply(null, vals.concat([1])), bw = (W - pl * 2) / n, step = n > 24 ? 6 : (n > 7 ? 3 : 1);
  var bars = '', lab = '';
  vals.forEach(function(v, k){
    var h = Math.max(v > 0 ? 3 : 1.5, (H - pb - pt) * v / max), x = pl + k * bw + bw * .14, y = H - pb - h;
    bars += '<rect class="bar' + (v > 0 ? '' : ' zero') + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * .72).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"/>';
    if(k % step === 0) lab += '<text x="' + (pl + k * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + labels[k] + '</text>';
  });
  var chart = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ចំណូលតាមរយៈពេល សរុប ' + usd(rev) + '">' +
    '<line class="gl" x1="' + pl + '" x2="' + (W - pl) + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '"/>' +
    '<text x="' + pl + '" y="9">' + (max > 1 || rev > 0 ? usd(max) : '') + '</text>' + bars + lab + '</svg>';

  var byGame = {};
  inR.filter(isRevenue).forEach(function(o){ var k = gameLabel(o); byGame[k] = (byGame[k] || 0) + Number(o.usd || 0); });
  var top = Object.keys(byGame).map(function(k){ return [k, byGame[k]]; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 5);
  var topMax = top.length ? top[0][1] : 1;
  var topHTML = top.length ? '<ul class="toplist">' + top.map(function(t){
    return '<li><span>' + esc(t[0]) + '</span><b class="tnum">' + usd(t[1]) + '</b><div class="meter"><i style="width:' + Math.max(4, t[1] / topMax * 100).toFixed(0) + '%"></i></div></li>';
  }).join('') + '</ul>' : '<p class="empty">មិនទាន់មានចំណូលក្នុងរយៈពេលនេះទេ</p>';

  var queue = pending.slice(-0).concat([]).slice(0, 0);
  var todoItems = toDeliver.slice().reverse().concat(pending.slice().reverse()).slice(0, 6);
  var todoHTML = todoItems.length ? '<div class="todo">' + todoItems.map(function(o){
    var isPend = o.status === 'pending';
    return '<div class="todo-row"><div><b>' + esc(o.id) + ' · ' + esc(gameLabel(o)) + '</b><span>' + fmt(o.amount) + ' ' + esc(o.unit || '') + ' · ' + usd(o.usd) + ' · ' + fmtDate(o.createdAt) + '</span></div>' +
      '<button class="btn small" type="button" data-write data-act="setStatus" data-id="' + esc(o.id) + '" data-s="' + (isPend ? 'paid' : 'delivered') + '">' + (isPend ? 'បានបង់រួច' : 'ដឹកជញ្ជូនរួច') + '</button></div>';
  }).join('') + '</div>' : '<p class="empty">គ្មានអ្វីត្រូវធ្វើទេ 🎉</p>';

  function chip(v, l){ return '<button class="fchip" type="button" data-act="range" data-v="' + v + '" aria-pressed="' + (S.range === v) + '">' + l + '</button>'; }
  return '<div class="page-head"><h1>សង្ខេប</h1><div class="chips">' + chip('today', 'ថ្ងៃនេះ') + chip('7', '៧ ថ្ងៃ') + chip('30', '៣០ ថ្ងៃ') + '</div></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="k-l">ចំណូល</div><div class="k-v">' + usd(rev) + '</div><div class="k-s">' + riel(rev) + '</div></div>' +
      '<div class="kpi"><div class="k-l">បញ្ជាទិញ</div><div class="k-v">' + fmt(cnt) + '</div><div class="k-s">មិនរាប់ដែលបោះបង់</div></div>' +
      '<div class="kpi' + (pending.length ? ' attn' : '') + '"><div class="k-l">រង់ចាំបង់</div><div class="k-v">' + fmt(pending.length) + '</div><div class="k-s">ត្រូវផ្ទៀងផ្ទាត់</div></div>' +
      '<div class="kpi' + (toDeliver.length ? ' attn' : '') + '"><div class="k-l">រង់ចាំដឹកជញ្ជូន</div><div class="k-v">' + fmt(toDeliver.length) + '</div><div class="k-s">បានបង់រួច</div></div>' +
    '</div>' +
    '<div class="grid2"><section class="card"><div class="card-head"><h2>ចំណូលតាមរយៈពេល</h2></div>' + chart + '</section>' +
    '<section class="card"><div class="card-head"><h2>ហ្គេមលក់ដាច់</h2></div>' + topHTML + '</section></div>' +
    '<section class="card"><div class="card-head"><h2>ត្រូវធ្វើ</h2><button class="btn small ghost" type="button" data-act="tab" data-v="orders">មើលទាំងអស់</button></div>' + todoHTML + '</section>';
}

    if(!q) return true;
    return (o.id + ' ' + o.pid + ' ' + (o.sid || '') + ' ' + gameLabel(o) + ' ' + (o.customer || '') + ' ' + (o.note || '') + ' ' + (o.method || '')).toLowerCase().indexOf(q) >= 0;
  });

function orderCard(o){

/* ---------- render ---------- */
function renderNav(){ $$('#nav button').forEach(function(b){ if(b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); }
function renderChip(){
  var chip = $('#modeChip');
  if(!S.canWrite){ chip.className = 'chip ro'; chip.innerHTML = '<i></i>មើលតែប៉ុណ្ណោះ'; }
  else if(S.mode === 'server'){ chip.className = 'chip'; chip.innerHTML = '<i></i>Server'; }
  else if(S.mode === 'shared'){ chip.className = 'chip'; chip.innerHTML = '<i></i>ចែករំលែក'; }
  else { chip.className = 'chip local'; chip.innerHTML = '<i></i>ក្នុងឧបករណ៍'; }
}
function renderView(){
  var v = $('#view'), html;
  if(S.tab === 'orders') html = viewOrders(); else if(S.tab === 'products') html = viewProducts(); else if(S.tab === 'accounts') html = viewAccounts(); else if(S.tab === 'look') html = viewLook(); else if(S.tab === 'settings') html = viewSettings(); else html = viewDash();
  var banner = '';
  if(!S.canWrite) banner = '<div class="banner ro">អ្នកមានសិទ្ធិមើលតែប៉ុណ្ណោះ។ សូមឱ្យម្ចាស់ផ្តល់សិទ្ធិកែប្រែ ("Can edit") ដើម្បីកែទិន្នន័យ។</div>';
  else if(S.mode === 'local') banner = '<div class="banner">ទិន្នន័យរក្សាទុកក្នុង browser នេះតែប៉ុណ្ណោះ (មិនចែករំលែកទៅឧបករណ៍ផ្សេង)។ បើកក្នុង Claude ដើម្បីរក្សាទុក និងចែករំលែកជាមួយក្រុម។</div>';
  v.innerHTML = banner + html;
}
function renderAll(fromData){
  if(S.mode === 'boot') return;
  renderChip(); renderNav();
  /* don't clobber a form the person is typing in when live data arrives */
  if(fromData){
    var ae = document.activeElement;
    if((S.tab === 'settings' || S.tab === 'look') && ae && ae.closest && ae.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
    if(S.tab === 'orders' && ae && ae.id === 'oq'){ $('#olistWrap').innerHTML = ordersListHTML(); return; }
  }
  renderView();
}
function setTab(t){
  S.tab = t; S.olimit = 60; renderAll(); window.scrollTo(0, 0);
}

var sheet = $('#sheet');

  S.sheet = {type:type, ctx:ctx || {}};

var cf = $('#confirmDlg'), cfResolve = null;
function askConfirm(title, text, yes){
  return new Promise(function(res){
    cfResolve = res;
    $('#cfTitle').textContent = title; $('#cfText').textContent = text || ''; $('#cfYes').textContent = yes || 'យល់ព្រម';
    if(typeof cf.showModal === 'function') cf.showModal(); else cf.setAttribute('open', '');
  });
}
function endConfirm(v){ var r = cfResolve; cfResolve = null; if(cf.close) cf.close(); else cf.removeAttribute('open'); if(r) r(v); }
$('#cfYes').addEventListener('click', function(){ endConfirm(true); });
$('#cfNo').addEventListener('click', function(){ endConfirm(false); });
cf.addEventListener('close', function(){ if(cfResolve){ var r = cfResolve; cfResolve = null; r(false); } });

    '<input id="' + id + '" value="' + esc(val) + '"' + (opts.type ? ' type="' + opts.type + '"' : '') + (opts.mode ? ' inputmode="' + opts.mode + '"' : '') + (opts.step ? ' step="' + opts.step + '"' : '') +
    (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + ' autocomplete="off"' + (opts.max ? ' maxlength="' + opts.max + '"' : '') + '>' +
    (opts.hint ? '<p class="hint">' + opts.hint + '</p>' : '') + '<p class="err" data-err="' + id + '"></p></div>';
}

/* Sync pack list / server field / labels with the chosen game */
function refreshOrderGameFields(keepAmount, initial){
  var gid = $('#f-game').value, g = gameById(gid), sel = $('#f-pack');
  var opts = '<option value="">— ជ្រើសកញ្ចប់ ឬបញ្ចូលខាងក្រោម —</option>';
  if(g) opts += g.packs.map(function(p, i){ return '<option value="' + i + '">' + fmt(p.a) + ' ' + esc(g.unitKm || g.unit) + ' — ' + usd(p.p) + '</option>'; }).join('');
  sel.innerHTML = opts;
  $('#w-gname').hidden = !!g;
  $('#w-sid').hidden = !(g && g.server);
  var lbl = $('label[for="f-pid"]'); lbl.textContent = g ? (g.idType === 'text' ? 'Username' : 'Player ID') : ($('#f-pid').dataset.lbl || lbl.textContent);
  if(g && !initial) $('#f-unit').value = g.unit;
  if(initial && g){ /* pre-select a matching pack */
    var am = Number($('#f-amount').value), us = Number($('#f-usd').value);
    g.packs.forEach(function(p, i){ if(p.a === am && Math.abs(p.p - us) < 0.005) sel.value = String(i); });
  }
}

function saveOrderFromForm(){
  clearErrs();
  var ctx = S.sheet.ctx, orig = ctx.orig, isNew = ctx.isNew;
  var code = $('#f-code').value.trim(), gid = $('#f-game').value, g = gameById(gid);
  var pid = $('#f-pid').value.trim(), sid = $('#f-sid').value.trim();
  var amount = Number($('#f-amount').value), price = Number($('#f-usd').value);
  var bad = false;
  if(!/^[A-Za-z0-9-]{3,30}$/.test(code)){ setErr('f-code', 'អក្សរឡាតាំង លេខ និង - ប៉ុណ្ណោះ (៣-៣០ តួ)'); bad = true; }
  else if(isNew && findOrder(code)){ setErr('f-code', 'លេខបញ្ជាទិញនេះមានរួចហើយ'); bad = true; }
  if(!g && !$('#f-gname').value.trim()){ setErr('f-gname', 'សូមបញ្ចូលឈ្មោះហ្គេម'); bad = true; }
  if(!pid){ setErr('f-pid', 'សូមបញ្ចូល ID'); bad = true; }
  if(g && g.server && !sid){ setErr('f-sid', 'សូមបញ្ចូល Server ID'); bad = true; }
  if(!(amount > 0)){ setErr('f-amount', 'ចំនួនត្រូវធំជាង ០'); bad = true; }
  if(!(price >= 0) || $('#f-usd').value === ''){ setErr('f-usd', 'សូមបញ្ចូលតម្លៃ'); bad = true; }
  if(bad){ var first = $('.err:not(:empty)', $('#shBody')); if(first){ var inp = document.getElementById(first.dataset.err); if(inp) inp.focus(); } return; }
  var when = new Date($('#f-time').value).getTime(); if(!isFinite(when)) when = orig.createdAt || Date.now();
  var status = $('#f-status').value;
  var o = Object.assign({}, orig, {
    id: isNew ? code : orig.id,
    gameId: g ? g.id : '', gameName: g ? g.name : $('#f-gname').value.trim(), region: g ? g.region : '',
    unit: $('#f-unit').value.trim(), idLabel: g ? (g.idType === 'text' ? 'Username' : 'Player ID') : (orig.idLabel || 'Player ID'),
    pid: pid, sid: (g ? g.server : sid) ? sid : '', amount: amount, usd: round2(price), method: $('#f-method').value, status: status,
    customer: $('#f-cust').value.trim(), note: $('#f-note').value.trim(), createdAt: when
  });
  o.log = (orig.log || []).slice();
  if(isNew) o.log.push({s:status, t:when});
  else if(status !== orig.status) o.log.push({s:status, t:Date.now()});
  commitOrder(o, isNew ? 'បានបន្ថែមបញ្ជាទិញ' : 'បានរក្សាទុក').then(function(ok){ if(ok) closeSheet(); });
}

function setImg(id, v){
  var h = document.getElementById(id); if(h) h.value = v || '';
  var p = document.getElementById('prev-' + id); if(p) p.innerHTML = prevHTML(v);
  var u = document.querySelector('[data-imgurl="' + id + '"]'); if(u) u.value = /^data:/.test(v || '') ? '' : (v || '');
}
function resizeImage(file, max, q){
  return new Promise(function(res, rej){
    if(!/^image\//.test(file.type)) return rej(new Error('type'));
    var rd = new FileReader(); rd.onerror = rej;
    rd.onload = function(){
      var im = new Image(); im.onerror = rej;
      im.onload = function(){
        var iw = im.naturalWidth || im.width || max, ih = im.naturalHeight || im.height || max;
        var s = Math.min(1, max / Math.max(iw, ih)), w = Math.max(1, Math.round(iw * s)), h = Math.max(1, Math.round(ih * s));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        var out = cv.toDataURL('image/webp', q || .85);
        if(out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/png');
        res(out);
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

  var f = input.files && input.files[0]; if(!f) return;
  var id = input.dataset.imgfile, max = Number(input.dataset.max) || 400;

/* ---------- KHQR test ---------- */
function tlv(tag, val){ val = String(val); return tag + ('0' + val.length).slice(-2) + val; }
function crc16(str){
  var crc = 0xFFFF;
  for(var i = 0; i < str.length; i++){
    crc ^= str.charCodeAt(i) << 8;
    for(var j = 0; j < 8; j++){ crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; }
  }
  return ('0000' + crc.toString(16).toUpperCase()).slice(-4);
}
function ascii(t, max){ return String(t).replace(/[^\x20-\x7E]/g, '').slice(0, max); }
function buildKHQR(o){
  var isKHR = o.currency === 'KHR', exp = o.now + o.expireMin * 60000;
  var acct = (o.merchantId && o.bank) ? tlv('30', tlv('00', o.account) + tlv('01', o.merchantId) + tlv('02', o.bank)) : tlv('29', tlv('00', o.account));
  var amt = isKHR ? String(Math.round(o.amount)) : Number(o.amount).toFixed(2);
  var q = tlv('00', '01') + tlv('01', '12') + acct + tlv('52', o.mcc || '5999') + tlv('53', isKHR ? '116' : '840') + tlv('54', amt) + tlv('58', 'KH') +
    tlv('59', ascii(o.name, 25)) + tlv('60', ascii(o.city, 15));
  if(o.bill) q += tlv('62', tlv('01', ascii(o.bill, 25)));
  q += tlv('99', tlv('00', String(o.now)) + tlv('01', String(exp)));
  q += '6304'; return q + crc16(q);
}
var qrLoading = null;
function ensureQR(cb){
  if(typeof qrcode === 'function'){ cb(true); return; }
  if(!qrLoading){
    qrLoading = new Promise(function(res){
      var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
      sc.onload = function(){ res(typeof qrcode === 'function'); }; sc.onerror = function(){ res(false); }; document.head.appendChild(sc);
    });
  }
  qrLoading.then(cb);
}
function qrDataURL(text){
  var qr = qrcode(0, 'Q'); qr.addData(text); qr.make();
  var n = qr.getModuleCount(), cell = 8, size = (n + 8) * cell, cv = document.createElement('canvas'); cv.width = cv.height = size;
  var x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.fillStyle = '#000';
  for(var r = 0; r < n; r++) for(var k = 0; k < n; k++) if(qr.isDark(r, k)) x.fillRect((k + 4) * cell, (r + 4) * cell, cell, cell);
  return cv.toDataURL('image/png');
}
function openQrTest(){
  var k = S.cfg.khqr, demo = !k.account;
  var payload = buildKHQR({account:k.account || 'your_account@bank', name:k.name, city:k.city, currency:k.currency, amount:1, bill:'TEST-001', now:Date.now(), expireMin:k.expireMin, mcc:k.mcc, merchantId:k.merchantId, bank:k.bank});
  openSheet('qr', 'សាកល្បង QR',
    '<div class="qrwrap"><div id="qrHolder" class="muted">កំពុងបង្កើត...</div><p><b>' + (k.currency === 'KHR' ? '៛4,100' : '$1.00') + '</b> · ' + esc(k.name) + '</p>' +
    (demo ? '<p class="banner ro" style="margin:0">មិនទាន់មាន Bakong Account ID ទេ QR នេះជាគំរូ។</p>' : '<p class="muted" style="text-align:center">ស្កេនជាមួយកម្មវិធីធនាគារ ហើយពិនិត្យថាឈ្មោះ និងចំនួនទឹកប្រាក់ត្រឹមត្រូវ មុនបើកលក់ពិត។</p>') +
    '<pre class="code" style="width:100%">' + esc(payload) + '</pre></div>',
    '<button class="btn ghost" type="button" data-act="closeSheet">បិទ</button><button class="btn" type="button" data-act="copyPayload">ចម្លងអត្ថបទ QR</button>', {payload:payload});
  ensureQR(function(ok){
    var h = $('#qrHolder'); if(!h) return;
    if(!ok){ h.textContent = 'មិនអាចបង្កើតរូប QR បានទេ (ត្រូវការអ៊ីនធឺណិត)'; return; }
    try{ h.innerHTML = '<img alt="KHQR សាកល្បង" src="' + qrDataURL(payload) + '">'; }catch(e){ h.textContent = 'មិនអាចបង្កើតរូប QR បានទេ'; }
  });

function runSeq(list, fn){
  var i = 0;
  return new Promise(function(res, rej){
    (function next(){ if(i >= list.length) return res(); Promise.resolve(fn(list[i++])).then(next, rej); })();
  });
}

    askConfirm('កំណត់ការកំណត់ឡើងវិញ?', 'ហ្គេម តម្លៃ វិធីបង់ និង KHQR នឹងត្រឡប់ទៅលំនាំដើម។ បញ្ជាទិញមិនត្រូវបានលុបទេ។', 'កំណត់ឡើងវិញ').then(function(y){
      if(y) commitConfig(function(c){ var d = defaultConfig(); Object.keys(c).forEach(function(k){ delete c[k]; }); Object.assign(c, d); }, 'បានកំណត់ឡើងវិញ');
    });
  }
};
var CHG = {
  toggleGame: function(el){ var id = el.dataset.id, on = el.checked; commitConfig(function(c){ var g = c.games.filter(function(x){ return x.id === id; })[0]; if(g) g.on = on; }, on ? 'បើកលក់' : 'បិទលក់'); },
  togglePay: function(el){ var id = el.dataset.id, on = el.checked; commitConfig(function(c){ var p = c.pays.filter(function(x){ return x.id === id; })[0]; if(p) p.on = on; }); },
  toggleTicker: function(el){ var on = el.checked; commitConfig(function(c){ c.ticker.on = on; }); },
  toggleAccount: function(el){ var i = Number(el.dataset.i), on = el.checked; commitConfig(function(c){ if(c.accounts[i]) c.accounts[i].on = on; }, on ? 'បើកលក់' : 'បិទលក់'); },
  toggleBanner: function(el){ var i = Number(el.dataset.i), on = el.checked; commitConfig(function(c){ if(c.banners[i]) c.banners[i].on = on; }); }
};

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(t && ACT[t.dataset.act]){ e.preventDefault(); ACT[t.dataset.act](t); return; }
  var tab = e.target.closest('[data-tab]'); if(tab){ setTab(tab.dataset.tab); }
});
document.addEventListener('change', function(e){
  var t = e.target.closest('[data-change]'); if(t && CHG[t.dataset.change]){ CHG[t.dataset.change](t); return; }
  if(e.target.matches('[data-imgfile]')){ imgPicked(e.target); return; }
  if(e.target.matches('[data-pfile]')){ packImgPicked(e.target); return; }
  if(e.target.matches('[data-imgurl]')){ setImg(e.target.dataset.imgurl, e.target.value.trim()); return; }
  if(e.target.id === 'a-imgfiles'){ acctImgsPicked(e.target); return; }
  if(e.target.id === 'pub-file'){ publishFile(e.target); return; }
  if(e.target.id === 'f-game'){ refreshOrderGameFields(null, false); }
  else if(e.target.id === 'f-pack'){
    var g = gameById($('#f-game').value), v = e.target.value;
    if(g && v !== ''){ var p = g.packs[Number(v)]; if(p){ $('#f-amount').value = p.a; $('#f-usd').value = p.p.toFixed(2); $('#f-unit').value = g.unit; } }
  }
});
document.addEventListener('input', function(e){
  if(e.target.id === 'oq'){ S.oq = e.target.value; S.olimit = 60; $('#olistWrap').innerHTML = ordersListHTML(); }
  else if(e.target.id === 'f-paste'){
    var r = parseReceipt(e.target.value); if(!r.code && !r.pid && !r.pack) return;
    if(r.code) $('#f-code').value = r.code;
    if(r.gameId){ $('#f-game').value = r.gameId; refreshOrderGameFields(null, false); }
    else if(r.game){ $('#f-game').value = '_other'; refreshOrderGameFields(null, false); $('#f-gname').value = r.game; }
    if(r.pid) $('#f-pid').value = r.pid;
    if(r.sid) $('#f-sid').value = r.sid;
    if(r.amount) $('#f-amount').value = r.amount;
    if(r.unit) $('#f-unit').value = r.unit;
    if(r.usd != null) $('#f-usd').value = r.usd.toFixed(2);
    if(r.method){ var sel = $('#f-method'); var has = $$('option', sel).some(function(o){ return o.value.toLowerCase() === r.method.toLowerCase(); }); if(!has){ var op = document.createElement('option'); op.value = op.textContent = r.method; sel.appendChild(op); } $$('option', sel).forEach(function(o){ if(o.value.toLowerCase() === r.method.toLowerCase()) sel.value = o.value; }); }
    if(r.status) $('#f-status').value = r.status;
    if(r.createdAt) $('#f-time').value = toLocalInput(r.createdAt);
    if(r.gameId){ var gg = gameById(r.gameId), am = Number(r.amount), us = Number(r.usd); gg.packs.forEach(function(p, i){ if(p.a === am) $('#f-pack').value = String(i); }); }
  }
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  var id = e.target.id;
  if(id === 'sf' && S.sheet){
    if(!guard()) return;
    var ty = S.sheet.type;
    if(ty === 'order') saveOrderFromForm(); else if(ty === 'game') saveGameFromForm(); else if(ty === 'bulk') applyBulk(); else if(ty === 'pay') savePayFromForm(); else if(ty === 'restore') doRestore(); else if(ty === 'account') saveAccountFromForm(); else if(ty === 'banner') saveBannerFromForm();
  } else if(id === 'formShop') saveShop();
  else if(id === 'formKhqr') saveKhqr();
  else if(id === 'formLook') saveLook();
});

function injectConfig(html, cfg){
  var re = /(<script[^>]*id=["']jt-config["'][^>]*>)([\s\S]*?)(<\/script>)/i;
  if(!re.test(html)) return null;
  var json = JSON.stringify(cfg).replace(/</g, '\\u003c');
  return html.replace(re, function(m, a1, b1, c1){ return a1 + json + c1; });
}
function publishFile(input){
  var file = input.files && input.files[0], msg = $('#pub-msg'); if(!file) return;
  msg.style.color = 'var(--muted)'; msg.textContent = 'កំពុងអាន...';
  file.text().then(function(html){
    var out = injectConfig(html, storefrontConfig());
    if(!out){ msg.style.color = ''; msg.textContent = 'ឯកសារនេះមិនមានកន្លែងទទួល Config (jt-config) ទេ។ សូមប្រើកំណែថ្មីបំផុតនៃឯកសារហាង Julian Topup។'; input.value = ''; return; }
    var name = file.name || 'index.html', sc = storefrontConfig();
    input.value = '';
    return saveFile(name, out).then(function(){
      msg.style.color = 'var(--ok)';
      msg.textContent = 'រួចរាល់! ' + sc.games.length + ' ហ្គេម · ' + sc.pays.length + ' វិធីបង់។ ឥឡូវ upload ឯកសារ ' + name + ' ទៅ hosting។';
    });
  }, function(){ msg.style.color = ''; msg.textContent = 'មិនអាចអានឯកសារបានទេ'; });
}

function saveShop(){
  ['s-tg', 's-rate'].forEach(function(i){ setErr(i, ''); });
  var name = $('#s-name').value.trim() || 'Julian Topup';
  var tg = $('#s-tg').value.trim().replace(/^https?:\/\/t\.me\//i, '').replace(/^@/, ''), rate = Number($('#s-rate').value), bad = false;
  if(!/^[A-Za-z0-9_]{5,32}$/.test(tg)){ setErr('s-tg', 'ឈ្មោះ Telegram ៥-៣២ តួ (អក្សរ លេខ _)'); bad = true; }
  if(!(rate >= 1000 && rate <= 10000)){ setErr('s-rate', 'អត្រាត្រូវនៅចន្លោះ 1,000 ដល់ 10,000'); bad = true; }
  if(bad) return;
  commitConfig(function(c){ c.shop.name = name; c.shop.telegram = tg; c.shop.rate = Math.round(rate); }, 'បានរក្សាទុកការកំណត់ហាង');
}
function saveKhqr(){
  ['k-acc', 'k-name', 'k-exp'].forEach(function(i){ setErr(i, ''); });
  var acc = $('#k-acc').value.trim(), name = ascii($('#k-name').value.trim() || 'Julian Topup', 25), exp = Number($('#k-exp').value), bad = false;
  if(acc && !/^[A-Za-z0-9._-]+@[A-Za-z0-9]+$/.test(acc)){ setErr('k-acc', 'ទម្រង់ត្រូវជា ឈ្មោះ@ធនាគារ ឧ. julian@aba'); bad = true; }
  if(!name){ setErr('k-name', 'ត្រូវជាអក្សរឡាតាំង'); bad = true; }
  if(!(exp >= 1 && exp <= 1440)){ setErr('k-exp', 'ចន្លោះ ១ ដល់ ១៤៤០ នាទី'); bad = true; }
  var mid = $('#k-mid').value.trim(), bank = $('#k-bank').value.trim();
  if(bad) return;
  commitConfig(function(c){
    c.khqr = {account:acc, name:name, city:ascii($('#k-city').value.trim() || 'Phnom Penh', 15), currency:$('#k-cur').value, expireMin:Math.round(exp), mcc:($('#k-mcc').value.trim() || '5999'), merchantId:mid, bank:bank};
  }, 'បានរក្សាទុក KHQR');
}

try{ var th = localStorage.getItem('jt-admin:theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
$('#themeBtn').addEventListener('click', function(){
  var root = document.documentElement;
  var cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

/* =====================================================================
   Boot: shared db inside Claude, local storage anywhere else
   ===================================================================== */
function ready(){
  $('#boot').hidden = true; $('#app').hidden = false;
  document.body.classList.toggle('ro', !S.canWrite);
  renderAll();
}
function startLocal(){
  if(S.mode !== 'boot') return;
  S.mode = 'local'; store = makeLocalStore(); store.init(ready);
}
function startShared(db){
  if(S.mode !== 'boot') return;
  S.mode = 'shared';
  var settle = function(){
    store = makeSharedStore(db);
    var guardTimer = setTimeout(function(){ ready(); }, 5000);
    store.init(function(){ clearTimeout(guardTimer); ready(); });
  };
  var uP = Promise.resolve(null);
  try{ uP = window.claude.use('user'); }catch(e){}
  Promise.race([uP, new Promise(function(r){ setTimeout(function(){ r(null); }, 2500); })]).then(function(u){
    if(!u) return null;
    return Promise.resolve(u.canEdit()).then(function(v){ S.canWrite = v !== false; }, function(){});
  }).then(settle, settle);
}
function boot(){
  var hasClaude = false;
  try{ hasClaude = !!(window.claude && typeof window.claude.use === 'function'); }catch(e){}
  if(!hasClaude){ startLocal(); return; }
  var timer = setTimeout(startLocal, 6000);
  window.claude.use('db').then(function(db){
    clearTimeout(timer);
    if(S.mode !== 'boot') return;
    if(!db) startLocal(); else startShared(db);
  }, function(){ clearTimeout(timer); startLocal(); });
}
/* =====================================================================
   Server store: Vercel /api/admin  (login + Upstash Redis)
   ===================================================================== */
var TOKEN_KEY = 'jt-admin:token', token = '';
try{ token = sessionStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
function showLogin(){
  $('#boot').hidden = true; $('#app').hidden = true; $('#login').hidden = false;
  setTimeout(function(){ $('#lg-pw').focus(); }, 50);
}
function api(action, data){
  return fetch('/api/admin', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token},
    body:JSON.stringify(Object.assign({action:action}, data || {}))})
  .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
    if(r.status === 401 && action !== 'login') showLogin();
    if(!r.ok){ var e = new Error(j.message || j.error || ('HTTP ' + r.status)); e.code = j.error; e.msg = j.message; throw e; }
    return j;
  }); });
}
function uploadAll(obj){
  var jobs = [], cache = {};
  (function walk(o){
    if(!o || typeof o !== 'object') return;
    Object.keys(o).forEach(function(k){
      var v = o[k];
      if(typeof v === 'string' && /^data:image\//.test(v)) jobs.push({o:o, k:k, v:v}); else walk(v);
    });
  })(obj);
  return jobs.reduce(function(p, j){ return p.then(function(){
    if(cache[j.v]){ j.o[j.k] = cache[j.v]; return; }
    return api('upload', {data:j.v}).then(function(r){ cache[j.v] = r.url; j.o[j.k] = r.url; });
  }); }, Promise.resolve());
}
function toApi(c){
  var on = function(x){ return x.on !== false; };
  var games = c.games.filter(function(g){ return on(g) && g.packs.length; }).map(function(g){
    return {id:g.id, short:g.short, name:g.name, region:g.region, mono:g.mono, tint:g.tint, unit:g.unit, unitKm:g.unitKm, vizo:g.vizo || '',
      server:!!g.server, idType:g.idType, pop:g.pop, img:g.img || '', packImg:g.packImg || '',
      packs:g.packs.map(function(p){ return [p.a, p.p, p.img || '']; })};
  });
  var ids = {}; games.forEach(function(g){ ids[g.id] = 1; });
  var bn = (c.banners || []).filter(function(b){ return on(b) && b.img; });
  return {
    telegram:c.shop.telegram, rate:c.shop.rate, logo:c.site.logoTopup || '', banner:bn.length ? bn[0].img : '', khqr:c.khqr,
    pays:c.pays.filter(on).map(function(p){ return {name:p.name, desc:p.desc, mono:p.mono, tint:p.tint, img:p.img || ''}; }),
    games:games,
    accounts:c.accounts.filter(function(a){ return on(a) && ids[a.game]; }).map(function(a){ return {game:a.game, title:a.title, usd:a.usd, specs:a.specs || [], images:a.images || []}; }),
    extra:{logoTopup:c.site.logoTopup || '', logoAccount:c.site.logoAccount || '', accent:c.site.accent || '', t:cleanTexts(c.site.t),
      banners:(c.banners || []).filter(function(b){ return on(b) && b.img; }).map(function(b){ return {img:b.img, game:b.game || '', url:b.url || ''}; })}
  };
}
function fromApi(c){
  if(c.ui) return normalizeConfig(c.ui);
  return normalizeConfig({
    shop:{name:'Julian Topup', telegram:c.telegram || '', rate:c.rate || 4100}, khqr:c.khqr || {},
    site:{logoTopup:c.logo || '', logoAccount:'', accent:'', t:{}},
    banners:c.banner ? [{id:'b1', img:c.banner, game:'', url:'', on:true}] : [],
    pays:(c.pays || []).map(function(p, i){ return {id:slug(p.name) || ('p' + i), name:p.name, desc:p.desc || '', mono:p.mono || '', tint:p.tint || '#3355F5', img:p.img || '', on:true}; }),
    games:(c.games || []).map(function(g){ g = clone(g); g.on = true; g.packs = (g.packs || []).map(function(p){ return {a:p[0], p:p[1], img:p[2] || ''}; }); return g; }),
    accounts:(c.accounts || []).map(function(a){ a = clone(a); a.on = true; return a; })
  });
}
function fromApiOrder(o){
  var acc = o.kind === 'account', pk = String(o.packText || '').match(/^([\d,.]+)\s*(.*)$/);
  var log = [{s:'pending', t:o.createdAt}];
  if(o.paidAt) log.push({s:'paid', t:o.paidAt});
  if(o.completedAt) log.push({s:'delivered', t:o.completedAt});
  return {id:o.code, kind:o.kind, gameId:o.game || '', gameName:o.gameName || (acc ? 'គណនីហ្គេម' : 'ផ្សេងៗ'), region:'', unit:pk ? pk[2] : '',
    idLabel:'Player ID', pid:acc ? (o.phone || '') : (o.pid || ''), sid:o.sid || '', amount:acc ? 1 : (pk ? Number(pk[1].replace(/,/g, '')) : 0),
    usd:o.usd, method:o.pay || 'KHQR', status:o.status === 'completed' ? 'delivered' : o.status, customer:o.name || '',
    note:acc ? (o.item + (o.note ? ' · ' + o.note : '')) : (o.note || ''), createdAt:o.createdAt, updatedAt:o.completedAt || o.paidAt || o.createdAt, log:log};
}
function toApiOrder(o){
  var gn = o.gameName + (o.region ? ' ' + o.region : '');
  return {code:o.id, kind:o.kind, game:o.gameId, gameName:gn, pid:o.pid, sid:o.sid, packText:o.amount + ' ' + o.unit,
    item:gn + ' · ' + o.amount + ' ' + o.unit, usd:o.usd, pay:o.method, status:o.status === 'delivered' ? 'completed' : o.status,
    name:o.customer, note:o.note, createdAt:o.createdAt};
}
function makeServerStore(){
  function loadOrders(){ return api('orders').then(function(r){ S.orders = (r.orders || []).map(fromApiOrder); sortOrders(); }); }
  return {
    init:function(done){
      Promise.all([api('getConfig'), loadOrders()]).then(function(r){
        S.cfg = fromApi(r[0].config); done();
        setInterval(function(){
          if(document.hidden || S.sheet || (S.tab !== 'orders' && S.tab !== 'dash')) return;
          loadOrders().then(function(){ renderAll(true); }, function(){});
        }, 30000);
      }, function(e){ if(!token || (e && e.code === 'unauthorized')) showLogin(); else { $('#boot').hidden = true; $('#login').hidden = true; $('#app').hidden = false; toast((e && e.msg) || 'តភ្ជាប់ Server មិនបាន', true); renderAll(); } });
    },
    saveConfig:function(cfg){
      var c = clone(cfg);
      return uploadAll(c).then(function(){ return api('saveConfig', {config:toApi(c), ui:c}); }).then(function(){ S.cfg = normalizeConfig(c); });
    },
    saveOrder:function(o){
      if(/^DEMO-/.test(o.id)) return Promise.reject({msg:'មិនអាចរក្សាទុកទិន្នន័យគំរូលើ Server បានទេ'});
      return api('putOrder', toApiOrder(o)).then(function(){
        var i = S.orders.findIndex(function(x){ return x.id === o.id; });
        if(i >= 0) S.orders[i] = clone(o); else S.orders.push(clone(o));
        sortOrders();
      });
    },
    deleteOrder:function(id){
      return api('deleteOrder', {code:id}).then(function(){ S.orders = S.orders.filter(function(x){ return x.id !== id; }); });
    }
  };
}
function startServer(){
  S.mode = 'server'; store = makeServerStore();
  $('#login').hidden = true; $('#boot').hidden = false;
  store.init(function(){ $('#login').hidden = true; ready(); });
}
function doLogin(){
  var pw = $('#lg-pw').value; $('#lg-err').textContent = '';
  if(!pw) return;
  $('#lg-go').disabled = true;
  api('login', {password:pw}).then(function(r){
    token = r.token; try{ sessionStorage.setItem(TOKEN_KEY, token); }catch(e){}
    $('#lg-pw').value = ''; $('#lg-go').disabled = false;
    if(S.mode === 'server' && store){ $('#login').hidden = true; $('#app').hidden = false; api('orders').then(function(r2){ S.orders = (r2.orders || []).map(fromApiOrder); sortOrders(); renderAll(true); }, function(){}); }
    else startServer();
  }, function(e){ $('#lg-go').disabled = false; $('#lg-err').textContent = (e && e.msg) || 'ចូលមិនបាន'; });
}
$('#lg-go').addEventListener('click', doLogin);
$('#lg-pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
if(token) startServer(); else showLogin();

})();
</script>
